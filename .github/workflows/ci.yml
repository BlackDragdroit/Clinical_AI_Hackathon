name: CI

on:
  push:
  pull_request:

jobs:
  test:            # job name kept: main's branch protection requires the "test" check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.13
      - run: uv run --no-sync pytest -q
