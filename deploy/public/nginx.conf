# One public entry for a remote test (ngrok -> :8088): Element, Synapse's client API, the app, Mailpit, FHIR read-only.
# The engine and the GPU are not reachable from here.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  client_max_body_size 20m;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  location /_matrix/ { proxy_pass http://synapse:8008; proxy_read_timeout 120s; }
  location /_synapse/client/ { proxy_pass http://synapse:8008; }

  location /dashboard/events { proxy_pass http://app:8000; proxy_buffering off; proxy_read_timeout 1h; }
  location ~ ^/(r/|eid/|audit|dashboard|sms|befund/) { proxy_pass http://app:8000; }

  location /mailpit/ { proxy_pass http://mailpit:8025; proxy_http_version 1.1;
                       proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }

  location /fhir/ { limit_except GET { deny all; } proxy_pass http://hapi:8080/fhir/; }

  location ~ ^/config\.[^/]+\.json$ { default_type application/json; alias /etc/nginx/element-public.json; }
  # ngrok's free plan needs a header on Element's API calls; the script adds it (deploy/public/ngrok-fix.js)
  location = /ngrok-fix.js { default_type application/javascript; alias /etc/nginx/ngrok-fix.js; }
  # Element's page: always a full answer (a 304 would keep a cached copy without the script), never stored
  location ~ ^/(index\.html)?$ {
    proxy_pass http://element:80;
    proxy_set_header Accept-Encoding "";
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    add_header Cache-Control "no-store" always;
    sub_filter '<head>' '<head><script src="/ngrok-fix.js"></script>';
    sub_filter_once on;
  }
  location / { proxy_pass http://element:80; }
}
