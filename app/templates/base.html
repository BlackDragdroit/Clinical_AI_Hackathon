<!doctype html>
<html lang="{{ lang | default('de') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ t('title') if t is defined else 'Sichere Dokumentenanfrage' }}{% endblock %}</title>
<style>
  :root { --brand: #1f5f8b; --brand-dark: #174a6d; --bg: #f5f7f8; --ink: #1d2327; --muted: #566269; --line: #c4ccd1; --err: #a4262c; }
  * { box-sizing: border-box; }
  body { font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  main { max-width: 34rem; margin: 0 auto; padding: .75rem 1rem 3rem; }
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
  .brand { font-weight: 700; color: var(--brand); }
  .lang { display: inline-flex; align-items: center; min-height: 44px; padding: 0 .9rem; border: 1px solid var(--line);
          border-radius: 22px; color: var(--ink); text-decoration: none; background: #fff; font-size: .95rem; }
  .steps { display: flex; gap: .4rem; list-style: none; padding: 0; margin: .25rem 0 1rem; font-size: .85rem; color: var(--muted); }
  .steps li { flex: 1; border-top: 4px solid var(--line); padding-top: .3rem; }
  .steps li.on { border-color: var(--brand); color: var(--ink); font-weight: 600; }
  .steps li.done { border-color: var(--brand); }
  .card { background: #fff; border-radius: 14px; padding: 1.25rem; box-shadow: 0 1px 3px #0002; }
  h2 { margin: 0 0 .5rem; font-size: 1.35rem; line-height: 1.25; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; padding: .8rem; border: 0;
         border-radius: 12px; background: var(--brand); color: #fff; font-size: 1.1rem; font-weight: 600; text-align: center;
         text-decoration: none; cursor: pointer; }
  .btn:hover, .btn:focus-visible { background: var(--brand-dark); }
  .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  label { display: block; margin: 1rem 0 .3rem; font-weight: 600; }
  input:not([type=radio]), textarea { width: 100%; min-height: 52px; padding: .75rem; font: inherit; border: 1px solid #8a959b; border-radius: 10px; background: #fff; }
  input[type=file] { padding: .6rem; }
  :focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }
  .muted { color: var(--muted); font-size: .92rem; }
  .err { color: var(--err); font-weight: 600; }
  .or { text-align: center; color: var(--muted); margin: .9rem 0 0; }
  .foot { text-align: center; margin-top: 1.5rem; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; } td, th { border-bottom: 1px solid #ddd; padding: .35rem; text-align: left; vertical-align: top; }
  {% block style %}{% endblock %}
</style>
</head>
<body><main>
  {% if switch_href is defined %}<div class="top"><span class="brand">{{ clinic }}</span>
    <a class="lang" href="{{ switch_href }}" hreflang="{{ other_lang }}" lang="{{ other_lang }}">{{ t('lang_switch') }}</a></div>{% endif %}
  {% block steps %}{% endblock %}
  {% block body %}{% endblock %}
  {% if t is defined %}<p class="muted foot">{{ t('footer') }}</p>{% endif %}
</main></body>
</html>
