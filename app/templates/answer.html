{% extends "base.html" %}
{% block body %}
<div class="card">
  <p class="muted">Angemeldet als {{ sender }}</p>
  <h2>{{ doc_label }} angefragt</h2>
  <p>{{ doctor }}, {{ clinic }}, bittet um den {{ doc_label }} für <strong>{{ req.patient_name }}</strong>.
     {% if req.reason %}<br>Grund: {{ req.reason }}{% endif %}</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">
    <label for="typed_name">Name der Patientin / des Patienten (wie im Dokument)</label>
    <input id="typed_name" name="typed_name" required autocomplete="off">
    <label for="typed_dob">Geburtsdatum (TT.MM.JJJJ)</label>
    <input id="typed_dob" name="typed_dob" required inputmode="numeric" autocomplete="off" placeholder="TT.MM.JJJJ">
    <label for="upload">Dokument hochladen (PDF, Foto/Scan, .md, .txt)</label>
    <input id="upload" name="upload" type="file" accept=".pdf,.md,.txt,image/*,application/pdf,text/plain,text/markdown">
    <label for="text">… oder Inhalt einfügen</label>
    <textarea id="text" name="text" rows="6"></textarea>
    <p><button class="btn" type="submit">Sicher senden</button></p>
  </form>
</div>
{% endblock %}
