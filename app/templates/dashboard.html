<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BefundBrücke – Anfragen</title>
<style>
  :root {
    --bg: #f5f7f8; --card: #fff; --fg: #1d2327; --muted: #5f6b72; --line: #e3e7ea; --track: #dfe4e7;
    --accent: #1f5f8b; --ok: #1e7f4f; --warn: #b7791f; --error: #b42318; --flash: #e8f1f8;
    --ok-soft: #e6f4ec; --warn-soft: #fff4ce; --error-soft: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15191c; --card: #1f2528; --fg: #e6eaec; --muted: #9aa5ab; --line: #2e363a; --track: #3a4347;
      --accent: #6fb3e0; --ok: #4cc38a; --warn: #e3b341; --error: #f47067; --flash: #24333d;
      --ok-soft: #1c3127; --warn-soft: #3a3220; --error-soft: #3d2222;
    }
  }
  * { box-sizing: border-box; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
  main { padding: .6rem .9rem 1rem; }

  /* header: title, live dot, counters, chain badge */
  .top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; }
  .top h1 { font-size: .95rem; margin: 0; margin-right: auto; }
  .live { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .8rem; }
  .live i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); }
  .live[data-state="on"] i { background: var(--ok); animation: beat 2s ease-in-out infinite; }
  .chip { padding: .1rem .5rem; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--card);
          border: 1px solid var(--line); }
  .chip b { display: inline-block; min-width: .8em; text-align: center; }
  .chip.ok b { color: var(--ok); } .chip.warn b { color: var(--warn); } .chip.error b { color: var(--error); }
  .chip.active b { color: var(--accent); }
  .chain[data-ok="false"] { color: var(--error); border-color: var(--error); }

  /* request cards */
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
          border-radius: 10px; padding: .55rem .8rem .6rem; margin-bottom: .5rem; transition: border-color .4s, background .4s; }
  .card[data-tone="draft"] { border-left-color: var(--track); }
  .card[data-tone="ok"] { border-left-color: var(--ok); }
  .card[data-tone="warn"] { border-left-color: var(--warn); }
  .card[data-tone="error"] { border-left-color: var(--error); }
  .card[data-tone="muted"] { border-left-color: var(--track); opacity: .7; }
  .head { display: flex; gap: .4rem; align-items: baseline; flex-wrap: wrap; }
  .head .id { font-family: ui-monospace, monospace; font-weight: 700; }
  .head .pt { font-weight: 600; }
  .badge { margin-left: auto; font-size: .75rem; font-weight: 700; padding: .05rem .5rem; border-radius: 999px;
           background: var(--flash); color: var(--accent); white-space: nowrap; }
  .card[data-tone="ok"] .badge { background: var(--ok-soft); color: var(--ok); }
  .card[data-tone="warn"] .badge { background: var(--warn-soft); color: var(--warn); }
  .card[data-tone="error"] .badge { background: var(--error-soft); color: var(--error); }
  .sub { color: var(--muted); font-size: .8rem; margin-top: .1rem; }

  /* the five steps: dot + connector that fills from the left */
  .steps { display: flex; list-style: none; padding: 0; margin: .55rem 0 0; }
  .steps li { position: relative; flex: 1; min-width: 0; text-align: center; font-size: .75rem; color: var(--muted); }
  .lbl, .ts { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .steps li:not(:first-child)::before, .steps li:not(:first-child)::after {
    content: ""; position: absolute; top: .45rem; right: 50%; width: 100%; height: 3px; margin-right: .55rem;
    background: var(--track); border-radius: 2px; }
  .steps li:not(:first-child)::after { background: var(--accent); transform: scaleX(0); transform-origin: left;
    transition: transform .6s cubic-bezier(.4, 0, .2, 1); }
  .steps li:not([data-state="todo"]):not([data-state="current"])::after { transform: scaleX(1); }
  .steps li[data-state="error"]::after { background: var(--error); }
  .steps li[data-state="warn"]::after { background: var(--warn); }
  .card[data-tone="ok"] .steps li::after { background: var(--ok); }
  .dot { position: relative; z-index: 1; display: block; width: 1.05rem; height: 1.05rem; margin: 0 auto .2rem;
         border-radius: 50%; border: 3px solid var(--track); background: var(--card); transition: background .3s, border-color .3s; }
  li[data-state="done"] .dot { background: var(--accent); border-color: var(--accent); }
  .card[data-tone="ok"] li[data-state="done"] .dot { background: var(--ok); border-color: var(--ok); }
  li[data-state="current"] .dot { border-color: var(--accent); animation: ring 1.6s ease-out infinite; }
  li[data-state="warn"] .dot { background: var(--warn); border-color: var(--warn); animation: ring-warn 1.6s ease-out infinite; }
  li[data-state="error"] .dot { background: var(--error); border-color: var(--error); }
  li[data-state="done"] .dot::after { content: ""; position: absolute; left: .22rem; top: .05rem; width: .22rem; height: .45rem;
         border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  li:not([data-state="todo"]) .lbl { color: var(--fg); font-weight: 600; }
  li[data-state="error"] .lbl { color: var(--error); } li[data-state="warn"] .lbl { color: var(--warn); }
  .ts { font-size: .68rem; font-variant-numeric: tabular-nums; min-height: 1em; }

  .alert { margin-top: .45rem; padding: .3rem .55rem; border-radius: 6px; background: var(--error-soft); color: var(--error);
           font-size: .8rem; font-weight: 600; }
  .hint { margin-top: .45rem; font-size: .78rem; color: var(--muted); }
  .hint code { background: var(--flash); color: var(--fg); padding: .05rem .35rem; border-radius: 4px; }
  .empty { color: var(--muted); }

  /* motion: one-shot classes the script adds when something changes */
  .enter { animation: enter .45s cubic-bezier(.2, .8, .2, 1) both; }
  .flash { animation: flash 1.2s ease-out; }
  .shake { animation: shake .5s ease-in-out, flash-error 1.6s ease-out; }
  .celebrate { animation: flash-ok 1.6s ease-out; }
  li.pop .dot { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  .bump { animation: pop .4s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(-10px) scale(.98); } }
  @keyframes flash { from { background: var(--flash); } }
  @keyframes flash-ok { from { background: var(--ok-soft); box-shadow: 0 0 0 3px var(--ok-soft); } }
  @keyframes flash-error { from { background: var(--error-soft); } }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  @keyframes pop { 50% { transform: scale(1.45); } }
  @keyframes ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
                    to { box-shadow: 0 0 0 .55rem transparent; } }
  @keyframes ring-warn { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 55%, transparent); }
                         to { box-shadow: 0 0 0 .55rem transparent; } }
  @keyframes beat { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body><main>
<div class="top">
  <h1>{{ clinic }} · Dokumentenanfragen</h1>
  <span class="chip active" title="laufend"><b data-count="active"></b> offen</span>
  <span class="chip warn" title="warten auf !ablegen / !verwerfen"><b data-count="warn"></b> Prüfung</span>
  <span class="chip error"><b data-count="error"></b> Fehlzustellung</span>
  <span class="chip ok"><b data-count="ok"></b> abgelegt</span>
  <span class="chip chain" id="chain"></span>
  <span class="live" id="live"><i></i><span>live</span></span>
</div>
<section id="cards"></section>
<p class="empty" id="empty" hidden>Noch keine Anfragen. Im Chat: <code>!anfrage …</code></p>
</main>
<script>
const INITIAL = {{ snap | tojson }};
const KEY = new URLSearchParams(location.search).get("k") || "";
const STATUS = { draft: "Entwurf", sent: "Gesendet", opened: "Geöffnet", identified: "Identität geprüft",
  answered: "Antwort eingegangen", filed: "Abgelegt", review: "Prüfung nötig", rejected: "Quarantäne",
  discarded: "Verworfen", blocked: "Gesperrt" };
const VIA = { email: "E-Mail", sms: "SMS" };
const list = document.getElementById("cards");
const els = new Map();
let prev = new Map(), prevCounts = null;

const time = ts => ts ? new Date(ts).toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
const when = ts => new Date(ts).toLocaleString("de-AT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

function replay(node, cls) {          // restart a one-shot animation class
  node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
  setTimeout(() => node.classList.remove(cls), 1700);
}

function build(c) {
  const a = document.createElement("article");
  a.className = "card";
  a.innerHTML = '<div class="head"><span class="id"></span><span class="doc"></span>·<span class="pt"></span>' +
    '<span class="badge"></span></div><div class="sub"></div><ol class="steps">' +
    c.steps.map(() => '<li><span class="dot"></span><span class="lbl"></span><span class="ts"></span></li>').join("") +
    '</ol><div class="alerts"></div><div class="hint" hidden>Im Chat: <code></code></div>';
  return a;
}

function fill(a, c, old) {
  a.dataset.tone = c.tone;
  a.querySelector(".id").textContent = c.id;
  a.querySelector(".doc").textContent = c.doc;
  a.querySelector(".pt").textContent = c.patient;
  a.querySelector(".badge").textContent = STATUS[c.status] || c.status;
  a.querySelector(".sub").textContent = `an ${c.to} (${VIA[c.via] || c.via}) · ${when(c.created)}` + (c.reason ? ` · ${c.reason}` : "");
  a.querySelectorAll(".steps li").forEach((li, i) => {
    const s = c.steps[i];
    li.dataset.state = s.state;
    li.querySelector(".lbl").textContent = s.label;
    li.querySelector(".ts").textContent = time(s.ts);
    if (old && old.steps[i].state !== s.state) replay(li, "pop");
  });
  const alerts = a.querySelector(".alerts");
  alerts.replaceChildren(...c.alerts.map(t => Object.assign(document.createElement("div"), { className: "alert", textContent: "⚠️ " + t })));
  const hint = a.querySelector(".hint");
  hint.hidden = !c.hint;
  hint.querySelector("code").textContent = c.hint;
  if (!old || JSON.stringify(old) === JSON.stringify(c)) return;
  if (old.tone !== c.tone && c.tone === "error") replay(a, "shake");
  else if (old.tone !== c.tone && c.tone === "ok") replay(a, "celebrate");
  else replay(a, "flash");
}

function render(snap, live) {
  snap.cards.forEach((c, i) => {
    let a = els.get(c.id);
    if (!a) {
      a = build(c);
      els.set(c.id, a);
      a.style.animationDelay = live ? "0s" : `${i * 70}ms`;
      a.classList.add("enter");
      a.addEventListener("animationend", e => { if (e.animationName === "enter") { a.classList.remove("enter"); a.style.animationDelay = ""; } });
    }
    if (list.children[i] !== a) list.insertBefore(a, list.children[i] || null);
    fill(a, c, prev.get(c.id));
  });
  const ids = new Set(snap.cards.map(c => c.id));
  for (const [id, a] of els) if (!ids.has(id)) { a.remove(); els.delete(id); }
  document.getElementById("empty").hidden = snap.cards.length > 0;
  for (const b of document.querySelectorAll("[data-count]")) {
    const n = snap.counts[b.dataset.count];
    if (prevCounts && prevCounts[b.dataset.count] !== n) replay(b, "bump");
    b.textContent = n;
  }
  const chain = document.getElementById("chain");
  chain.dataset.ok = snap.chain_ok;
  chain.textContent = snap.chain_ok ? "🔗 Audit-Kette intakt" : "⛓️‍💥 Audit-Kette verletzt";
  prev = new Map(snap.cards.map(c => [c.id, c]));
  prevCounts = snap.counts;
}

render(INITIAL, false);
const live = document.getElementById("live");
const es = new EventSource(`/dashboard/events?k=${encodeURIComponent(KEY)}`);
es.onopen = () => { live.dataset.state = "on"; live.lastChild.textContent = "live"; };
es.onerror = () => { live.dataset.state = "off"; live.lastChild.textContent = "verbinde…"; };
es.onmessage = e => render(JSON.parse(e.data), true);
</script>
</body>
</html>
