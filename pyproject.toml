[project]
name = "befundbruecke"
version = "0.1.0"
description = "Request documents from outside the PGK network, verify sender and patient, file as FHIR R4."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "matrix-nio>=0.25",
    "fhir.resources>=7.1",
    "tzdata>=2026.6",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.47",
    "reportlab>=5.1.0",
    "numpy>=2.5.4",
]
voice = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.4.0",
    "onnx-asr>=0.12.0",
    "piper-tts>=1.8.0",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
# core/ uses flat imports (from fs_matcher import ...), so it goes on the path as-is
pythonpath = ["core", "."]
testpaths = ["tests"]

[tool.uv]
package = false
