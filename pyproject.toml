[project]
name = "befundbruecke"
version = "0.1.0"
description = "Request documents from outside the PGK network, verify sender and patient, file as FHIR R4."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "matrix-nio>=0.25",
    "fhir.resources>=7.1",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.47"]

[tool.pytest.ini_options]
# core/ uses flat imports (from fs_matcher import ...), so it goes on the path as-is
pythonpath = ["core", "."]
testpaths = ["tests"]

[tool.uv]
package = false
